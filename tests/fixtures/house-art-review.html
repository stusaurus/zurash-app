<!doctype html><html lang="ja"><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>トリケンの家｜同画角の美術比較</title>
<style>*{box-sizing:border-box}body{margin:0;background:#142b43;font:13px system-ui;color:#e8e4d0}header{padding:10px 14px}#art{width:min(100%,480px);margin:auto;aspect-ratio:480/540;background:#b2cadb}#art>svg{display:block;width:100%;height:100%}p{padding:10px 14px;margin:0}svg image{image-rendering:auto}.building-now{opacity:.72}</style>
<header id="caption"></header><main id="art"></main><p>美術比較用。修復状態を表示するテストデータを使い、ゲームのセーブや星は変更しません。</p>
<script type="module">
import {newHome,TASKS} from '/src/puzzle/house.js';
import {renderHouseScene} from '/src/house-scenes.js';
import {renderHouseScene as previous} from '/tests/fixtures/pr4-house-scenes.js';
const q=new URLSearchParams(location.search),scene=q.get('scene')==='entry'?'entry':'exterior',version=q.get('version')==='pr4'?'pr4':'new',state=q.get('state')??'complete',style=Math.max(0,Math.min(2,Number(q.get('style')??0))),s=newHome();
for(const t of TASKS.slice(0,3)){s.home.styles[t.id]=style;if(state==='complete'){s.home.done[t.id]=true;s.progress.town[t.id]=t.cost;}}
if(state==='building'){s.home.pending='home-entry-0';s.progress.town['home-entry-0']=3;}
document.querySelector('#caption').textContent=`${version==='pr4'?'PR #4':'第5段階'} · ${scene==='entry'?'玄関':'外観'} · ${state} · デザイン${style+1}`;
document.querySelector('#art').innerHTML=(version==='pr4'?previous:renderHouseScene)(s,scene);
document.documentElement.dataset.ready='true';
</script></html>
