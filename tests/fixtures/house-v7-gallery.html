<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>第7段階｜トリケンの家・美術確認</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:#263e43;background:#e7f0ec}
*{box-sizing:border-box}
body{margin:0}
main{width:min(100%,720px);margin:0 auto;padding:18px 14px 56px}
header{text-align:center;padding:12px 0 14px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:#537a78;font-weight:750}
h1{font-size:clamp(20px,5vw,28px);margin:5px 0 8px}
.note{font-size:12px;line-height:1.6;color:#526969;margin:0}
.controls{display:grid;gap:12px;margin:14px 0}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-size:13px;font-weight:750;margin-bottom:8px}
.button-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
button{font:inherit;touch-action:manipulation;min-height:44px;padding:8px 6px;border:1px solid #a7bdad;border-radius:12px;color:#3d574f;background:#fbfdf7;font-size:13px;font-weight:750;cursor:pointer}
button[aria-pressed="true"]{color:#fff;background:#416d64;border-color:#416d64;box-shadow:0 2px 5px #2b5c512b}
button:focus-visible{outline:3px solid #efbd60;outline-offset:2px}
.state-controls{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.state-controls button{font-size:11px;padding:7px 2px}
.preview{border:2px solid #d1dfd6;border-radius:19px;background:#b2c8c2;overflow:hidden;box-shadow:0 12px 32px #1d423225}
.preview svg{display:block;width:100%;height:auto;aspect-ratio:480/540}
.loading{padding:8px 12px;font-size:12px;background:#e9f2ed}
footer{font-size:12px;line-height:1.8;margin-top:15px;color:#48635c}
footer a{color:#276259;font-weight:750}
@media(max-width:370px){.button-row{gap:5px}button{font-size:12px}.state-controls button{font-size:10px}}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">ZURASH! · CHAPTER 01 · V7</div>
<h1>トリケンの家｜美術確認</h1>
<p class="note">6つの場所と、修復前・工事中・完成後3種類を見比べられます。<br>このページでは星・修復進行・セーブデータは変更しません。</p></header>
<section class="controls" aria-label="表示切り替え">
<fieldset><legend>場所を選ぶ</legend><div class="button-row" id="scenes"></div></fieldset>
<fieldset><legend>修復状態を選ぶ</legend><div class="button-row state-controls" id="states"></div></fieldset>
</section>
<div class="loading" id="status" role="status" aria-live="polite">画像を準備しています…</div>
<div class="preview" id="preview" role="img" aria-label="トリケンの家の美術プレビュー"></div>
<footer>見比べた後は <a href="/adventure.html">通常のゲームへ戻る</a>。この確認ページはゲームから独立しており、正式採用を意味しません。実機での確認が必要です。</footer>
</main>
<script type="module">
import {SCENES,renderHouseScene} from '/src/house-scenes.js';
import {newHome,TASKS,validateHome} from '/src/puzzle/house.js';
const status=document.querySelector('#status');
const preview=document.querySelector('#preview');
const scenePanel=document.querySelector('#scenes');
const statePanel=document.querySelector('#states');
const states=[['before','修復前'],['building','工事中'],['a','完成 A'],['b','完成 B'],['c','完成 C']];
const scenes=new Map(SCENES);
const url=new URL(location.href);
const query=url.searchParams;
let scene=scenes.has(query.get('scene'))?query.get('scene'):'exterior';
let state=states.some(x=>x[0]===query.get('state'))?query.get('state'):'before';
let token=0;
function controls(){
 scenePanel.replaceChildren();
 for(const [id,name] of SCENES){
  const b=document.createElement('button');b.type='button';b.textContent=name;b.dataset.scene=id;b.setAttribute('aria-pressed',String(scene===id));
  b.addEventListener('click',()=>{scene=id;draw();});scenePanel.append(b);
 }
 statePanel.replaceChildren();
 for(const [id,name] of states){
  const b=document.createElement('button');b.type='button';b.textContent=name;b.dataset.state=id;b.setAttribute('aria-pressed',String(state===id));
  b.addEventListener('click',()=>{state=id;draw();});statePanel.append(b);
 }
}
async function draw(){
 const thisDraw=++token;
 controls();
 const save=newHome();
 save.home.reached=50;
 for(let n=1;n<=50;n++)save.progress.completed['pz-'+(100000+n)]={reward:1,bestTurns:1,revision:1};
 if(state!=='before'){
  const style={a:0,b:1,c:2,building:0}[state];
  for(const t of TASKS){save.home.done[t.id]=true;save.progress.town[t.id]=t.cost;save.home.styles[t.id]=style;}
  if(state==='building'){
   const task=TASKS.find(t=>t.area===(scene==='exterior'?'entry':scene));
   if(task){delete save.home.done[task.id];save.home.pending=task.id;}
  }
 }
 validateHome(save);
 const svg=renderHouseScene(save,scene);
 preview.innerHTML=svg;
 preview.setAttribute('aria-label',scenes.get(scene)+'・'+states.find(x=>x[0]===state)[1]);
 query.set('scene',scene);query.set('state',state);
 history.replaceState(null,'',url.pathname+'?'+query.toString());
 status.textContent='画像を読み込んでいます…';
 document.body.dataset.ready='loading';
 const images=[...preview.querySelectorAll('image')];
 try{
  await Promise.all(images.map(el=>new Promise((resolve,reject)=>{
   const i=new Image();
   i.onload=resolve;i.onerror=()=>reject(new Error(el.getAttribute('href')));
   i.src=el.getAttribute('href');
   if(i.complete){if(i.naturalWidth>0)resolve();else reject(new Error(el.getAttribute('href')));}
  })));
  if(token!==thisDraw)return;
  status.textContent=scenes.get(scene)+' ／ '+states.find(x=>x[0]===state)[1]+' · '+images.length+'画像 読み込み済み';
  document.body.dataset.ready='true';
 }catch(err){
  if(token!==thisDraw)return;
  status.textContent='画像の読み込みに失敗: '+err.message;
  document.body.dataset.ready='error';
 }
}
draw();
</script>
</body>
</html>
