<!doctype html>
<html lang="ja" class="zurash-unified">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#dce9dd"><title>ズラッシュ！｜第1章 トリケンの家</title>
  <link rel="stylesheet" href="./adventure.css">
  <link rel="stylesheet" href="./expedition.css">
  <!-- Explicit A/B preview only: approved asset palette; original view is untouched. -->
  <script>if(new URLSearchParams(location.search).get('art')==='approved')document.documentElement.classList.add('art-review-approved');</script>
  <link rel="stylesheet" href="./adventure-ice-visual.css">
  <link rel="stylesheet" href="./zurash-unified-ui.css">
  <script type="module" src="./src/adventure.js"></script>
</head>
<body>
  <main class="adventure">
    <header class="masthead"><img src="./assets/zurash-approved-logo.webp" alt="ズラッシュ！" class="logo"><div><span class="eyebrow">第1章</span><h1>トリケンの家</h1></div></header>
    <nav id="chapter-navigation" class="zurash-route-nav" aria-label="冒険する章"><a href="./adventure.html" aria-current="page">🏠 第1章・家</a><a id="chapter-two-link" href="./chapter-two.html">❄ 第2章・氷海</a><a href="./duel-boss.html">⚔ CPU対戦</a><small id="chapter-two-lock"></small></nav>
    <section id="home-screen" class="home-screen"></section>
    <section id="expedition-home" class="expedition-home" aria-label="氷海の冒険の思い出" hidden></section>
    <section hidden class="game-panel" aria-labelledby="stage-title">
      <div class="stage-heading"><div><span id="stage-number" class="eyebrow">読み込み中</span><h2 id="stage-title">トリケンの家へようこそ</h2></div><button id="return-home" class="quiet">家へ</button><button id="stage-list" class="quiet" disabled>ステージ</button></div>
      <p id="focus" class="focus">滑って、壁をずらして、星を集めよう。</p>
      <p class="tap-hint">黄色く光るマスをタップして滑ろう。壁を動かすときは壁をタップ！</p>
      <div class="score-strip"><span>手数 <b id="moves">0</b></span><span>のこりの星 <b id="remaining">—</b></span><span class="town-stars">家づくりの星 <b id="balance">0</b></span><span id="chapter-one-best" class="chapter-one-best" hidden></span></div>
      <div id="board" class="board" aria-label="パズル盤面"></div>
      <div class="legend"><span>● 止まれるマス</span><span><i class="sample wall-sample"></i>動く壁</span><span id="ice-legend" hidden><i class="sample socket-sample"></i>氷のソケット</span><span id="warp-legend" hidden><i class="sample portal-sample"></i>ポータル</span></div>
      <div class="controls">
        <div class="preparation"><span class="eyebrow">① 準備を選ぶ</span><div id="modes" class="modes"></div><p id="instruction" class="instruction">壁移動は省略できます。</p></div>
        <div class="direction"><span class="eyebrow">② 滑る方向</span><div class="dpad"><button data-dir="0" aria-label="上へ滑る">▲</button><button data-dir="3" aria-label="左へ滑る">◀</button><span class="dpad-center" aria-hidden="true">❄</span><button data-dir="1" aria-label="右へ滑る">▶</button><button data-dir="2" aria-label="下へ滑る">▼</button></div></div>
      </div>
      <div class="utilities"><button id="undo" class="quiet" disabled>1手もどる</button><button id="retry" class="quiet" disabled>やり直す</button><button id="hint" class="quiet" disabled>ヒント</button></div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>
    <section hidden class="town-panel" aria-labelledby="town-title"><div class="town-heading"><div><span class="eyebrow">星で育つ家</span><h2 id="town-title">家のようす</h2></div><span id="completion">0 / 50 クリア</span></div><div id="town" class="town"></div><p>初回クリアで星を1個。10・20・30面の入口では、道具が無料で解放されます。</p></section>
    <footer>第1章は全50ステージ。盤面の星は止まったマスで取れます。</footer>
  </main>
  <dialog id="stage-dialog"><div class="dialog-head"><h2>第1章のステージ</h2><button data-close-stages class="quiet">閉じる</button></div><div id="stage-grid" class="stage-grid"></div></dialog>
  <dialog id="notice"><span id="notice-kicker" class="eyebrow"></span><h2 id="notice-title"></h2><p id="notice-text"></p><div id="notice-rank" class="notice-rank" hidden aria-live="polite"><span id="notice-rank-label" class="notice-rank-label"></span><span id="notice-rank-detail" class="notice-rank-detail"></span></div><div class="notice-actions"><button id="notice-primary" class="primary">つづける</button><button id="notice-secondary" class="quiet" hidden>もう一度</button></div></dialog>
</body>
</html>
