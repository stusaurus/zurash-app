name: Publish GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '*.html'
      - '*.css'
      - 'src/**'
      - 'data/**'
      - 'assets/**'
      - 'scripts/build-public-site.js'
      - 'tests/public-site-bundle.test.js'
      - '.github/workflows/pages.yml'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify-static-bundle:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify published chapter routes, worker, data and art
        run: |
          node --test tests/public-site-bundle.test.js
          node scripts/build-public-site.js dist
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test && npm run check
      - name: Prepare and validate complete static adventure bundle
        run: |
          node --test tests/public-site-bundle.test.js
          node scripts/build-public-site.js dist
          for stylesheet in style.css world.css world-mobile.css mobile-hud.css mobile-focus.css mobile-tap.css; do
            test -s "dist/${stylesheet}"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published Triken images
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}/assets"
          for color in orange aqua lime purple; do
            asset="triken-${color}-80.png"
            # The Pages CDN may need a short propagation window after deployment.
            ok=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --max-time 10                 "${base}/${asset}?build=${GITHUB_SHA}" -o "/tmp/${asset}"                 && cmp -s "dist/assets/${asset}" "/tmp/${asset}"; then
                echo "Confirmed live image: ${asset}"
                ok=true
                break
              fi
              sleep 5
            done
            test "${ok}" = true
          done
