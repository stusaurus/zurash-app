name: Unified ice visual smoke

on:
  push:
    branches:
      - design/unified-ice-v3
    paths:
      - 'zurash-unified-ui.css'
      - 'tests/browser/unified-ice-navigation.spec.js'
      - '.github/workflows/unified-ice-visual-smoke.yml'
  workflow_dispatch:

jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check mobile test syntax
        run: node --check tests/browser/unified-ice-navigation.spec.js
      - run: npx playwright install --with-deps chromium webkit
      - name: Validate 320px and 390px layouts in Chromium and WebKit
        run: npx playwright test tests/browser/unified-ice-navigation.spec.js --workers=1
      - name: Save Playwright visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-ice-visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
