name: Chapter two fast playable preview

on:
  pull_request:
    paths:
      - '*.html'
      - '*.css'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - 'scripts/build-chapter-two-preview.js'
      - 'tests/preview/**'
      - 'tests/cpu-encounter.test.js'
      - 'playwright.preview-bundle.config.js'
      - 'package*.json'
      - '.github/workflows/chapter-two-fast-preview.yml'
  workflow_dispatch:

concurrency:
  group: chapter-two-fast-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check game UI syntax and independent review data
        run: |
          node --check src/chapter-fun-lab.js
          node --check src/chapter-two-review.js
          node --check src/boss-duel.js
          node --check src/boss-cpu-worker.js
          node --test tests/chapter-two-review-summary.test.js tests/chapter-two-playtest.test.js tests/move-history.test.js tests/move-effects.test.js tests/board-cues.test.js tests/star-journey.test.js tests/clear-presentation.test.js tests/clear-record.test.js tests/personal-best-pace.test.js tests/clear-share.test.js tests/challenge-replay-link.test.js tests/invitation-guide.test.js tests/control-guide.test.js tests/tap-landing.test.js tests/boss-duel.test.js tests/boss-cpu-settings.test.js tests/boss-cpu-benchmark.test.js tests/cpu-encounter.test.js tests/expedition-album.test.js
      - name: Audit paired CPU difficulty with honest unresolved outcomes
        timeout-minutes: 7
        run: |
          node scripts/boss-cpu-benchmark.js --quick
          node scripts/boss-cpu-benchmark.js --full
      - name: Save reproducible CPU audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-two-cpu-audit-${{ github.run_attempt }}
          path: |
            reports/boss-cpu-step39-quick.json
            reports/boss-cpu-step39-quick.md
            reports/boss-cpu-step39-full.json
            reports/boss-cpu-step39-full.md
          if-no-files-found: warn
          retention-days: 14
      - name: Build the isolated chapter two static preview
        run: node scripts/build-chapter-two-preview.js
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Smoke-test the actual packaged files and A/B review flow
        run: npx playwright test -c playwright.preview-bundle.config.js --output=test-results-preview-fast
      - name: Save early independently tested preview (not a full QA approval)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-two-fast-preview-${{ github.run_attempt }}
          path: preview-dist/
          retention-days: 14
      - name: Save diagnostics when the packaged preview fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-two-fast-preview-failure-${{ github.run_attempt }}
          path: |
            playwright-preview-report/
            test-results-preview-fast/
          if-no-files-found: warn
          retention-days: 14
